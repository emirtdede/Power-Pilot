<!DOCTYPE html>
<html class="dark fonts-pending" lang="tr">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; worker-src 'none'" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link href="vendor/fonts/public-sans.css" rel="stylesheet" />
    <link href="vendor/fonts/material-symbols.css" rel="stylesheet" />
    <link href="renderer/tailwind.css" rel="stylesheet" />
    <link href="renderer/mini.css" rel="stylesheet" />
    <script src="renderer/font-ready.js"></script>
</head>
<body class="w-full h-full flex items-center justify-center">
    <div class="w-[260px] h-[64px] bg-[#1e293b]/95 border border-slate-700/60 backdrop-blur-md rounded-2xl p-2.5 shadow-2xl flex flex-col justify-between widget-drag transition-all duration-300">
        <!-- Top Row -->
        <div class="flex items-center justify-between w-full">
            <!-- Action Title -->
            <span class="text-xs font-semibold text-slate-400 truncate pr-2" id="action-text">--</span>
            
            <!-- Controls -->
            <div class="flex items-center gap-1.5 no-drag">
                <!-- Send to Background (Hide Widget) -->
                <button id="btn-hide" title="Arka Plana Gönder" class="w-5 h-5 rounded hover:bg-slate-700/60 text-slate-400 hover:text-slate-200 flex items-center justify-center transition-colors focus:outline-none">
                    <span class="material-symbols-outlined text-[15px]">visibility_off</span>
                </button>
                <!-- Restore Main App -->
                <button id="btn-restore" title="Uygulamayı Aç" class="w-5 h-5 rounded hover:bg-slate-700/60 text-slate-400 hover:text-slate-200 flex items-center justify-center transition-colors focus:outline-none">
                    <span class="material-symbols-outlined text-[15px]">open_in_full</span>
                </button>
                <!-- Cancel / Close Timer -->
                <button id="btn-cancel" title="Zamanlayıcıyı İptal Et" class="w-5 h-5 rounded hover:bg-red-500/20 text-slate-400 hover:text-red-400 flex items-center justify-center transition-colors focus:outline-none">
                    <span class="material-symbols-outlined text-[15px]">close</span>
                </button>
            </div>
        </div>
        
        <!-- Bottom Row (Digital Clock) -->
        <div class="flex items-baseline w-full">
            <span class="text-2xl font-black text-white tracking-wide leading-none" id="countdown-text">00:00</span>
        </div>
    </div>
    <script src="renderer/mini.js"></script>
</body>
</html>
