<!DOCTYPE html>
<html class="dark fonts-pending" lang="tr">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; worker-src 'none'" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link id="pp-favicon" rel="icon" type="image/png" href="assets/icons/monochrome-dark.png" />
    <link href="vendor/fonts/public-sans.css" rel="stylesheet" />
    <link href="vendor/fonts/material-symbols.css" rel="stylesheet" />
    <link href="renderer/tailwind.css" rel="stylesheet" />
    <link href="renderer/mini.css" rel="stylesheet" />
    <script src="renderer/font-ready.js"></script>
</head>
<body class="w-full h-full flex items-center justify-center">
    <div class="w-full h-full max-w-[260px] bg-[#1e293b]/95 border border-slate-700/60 backdrop-blur-md rounded-2xl p-2.5 shadow-2xl flex flex-col justify-between widget-drag transition-all duration-300">
        <!-- Top Row -->
        <div class="flex items-center justify-between w-full">
            <!-- Action Title -->
            <span class="text-xs font-semibold text-slate-300 truncate pr-2" id="action-text">--</span>
            
            <!-- Controls -->
            <div class="flex items-center gap-1 no-drag">
                <!-- Send to Background (Hide Widget) -->
                <button id="btn-hide" data-i18n-title="miniHide" title="Arka Plana Gönder" aria-label="Arka plana gönder" class="w-6 h-6 rounded hover:bg-slate-700/60 text-slate-300 hover:text-slate-100 flex items-center justify-center transition-colors">
                    <span class="material-symbols-outlined text-[15px]" aria-hidden="true">visibility_off</span>
                </button>
                <!-- Restore Main App -->
                <button id="btn-restore" data-i18n-title="miniRestore" title="Uygulamayı Aç" aria-label="Uygulamayı aç" class="w-6 h-6 rounded hover:bg-slate-700/60 text-slate-300 hover:text-slate-100 flex items-center justify-center transition-colors">
                    <span class="material-symbols-outlined text-[15px]" aria-hidden="true">open_in_full</span>
                </button>
                <!-- Cancel / Close Timer -->
                <button id="btn-cancel" data-i18n-title="miniCancel" title="Zamanlayıcıyı İptal Et" aria-label="Zamanlayıcıyı iptal et" class="w-6 h-6 rounded hover:bg-red-500/20 text-slate-300 hover:text-red-400 flex items-center justify-center transition-colors">
                    <span class="material-symbols-outlined text-[15px]" aria-hidden="true">close</span>
                </button>
            </div>
        </div>
        
        <!-- Bottom Row (Digital Clock) -->
        <div class="flex items-baseline w-full">
            <span class="text-white tracking-wide leading-none mini-clock" id="countdown-text">00:00</span>
        </div>
    </div>
    <script src="renderer/mini.js"></script>
</body>
</html>
