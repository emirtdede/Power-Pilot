name: Bug report
description: Report a reproducible defect in Power Pilot.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Power Pilot. Do **not** report security
        vulnerabilities here. Use the
        [security policy](https://github.com/emirtdede/power-pilot/security/policy)
        instead.

        You can write in Turkish or English.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am running the latest available Power Pilot release.
          required: true
        - label: This report does not contain a security vulnerability.
          required: true

  - type: input
    id: version
    attributes:
      label: Power Pilot version
      description: Shown under Settings > About.
      placeholder: "1.1.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: "Windows 11 24H2 (26100.1742)"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation type
      options:
        - Microsoft Store (MSIX)
        - NSIS installer
        - Portable / unpacked build
        - Built from source
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence.
      placeholder: |
        1. Open ...
        2. Set ...
        3. Wait for ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Remove API keys, tokens, customer names, and personal data.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Power settings, peripherals, integrations, or recent changes.

  - type: checkboxes
    id: privacy
    attributes:
      label: Data handling
      options:
        - label: I removed secrets and personal data from this report.
          required: true
