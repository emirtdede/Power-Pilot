# Weekly check for vulnerabilities published after the last push.
# Dependabot handles update PRs; this workflow provides a fast, explicit gate.
name: Dependency audit

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: true

jobs:
  audit:
    name: npm audit and license policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm

      - name: Audit production dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=high

      - name: Verify license policy
        run: npm run audit:licenses
